name: Notify IndexNow

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'index.md'
      - 'guias/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'llms.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for production deploy
        run: sleep 45

      - name: Submit sitemap URLs to IndexNow
        env:
          INDEXNOW_KEY: cc8d75076fb0c44395d8f7fc0e242af6
        run: |
          python - <<'PY'
          import json, os, urllib.request, xml.etree.ElementTree as ET

          root = ET.parse("sitemap.xml").getroot()
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [node.text.strip() for node in root.findall("sm:url/sm:loc", ns) if node.text]

          payload = json.dumps({
              "host": "appmaisum.com.br",
              "key": os.environ["INDEXNOW_KEY"],
              "keyLocation": f"https://appmaisum.com.br/{os.environ['INDEXNOW_KEY']}.txt",
              "urlList": urls,
          }).encode()

          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=payload,
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  print("IndexNow status:", response.status)
                  print("Submitted URLs:", len(urls))
          except urllib.error.HTTPError as exc:
              print("IndexNow HTTP status:", exc.code)
              body = exc.read().decode("utf-8", "replace")
              if body:
                  print(body)
              if exc.code not in (200, 202):
                  raise
          PY
